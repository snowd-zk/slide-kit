[package]
name = "slide_render"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
chromiumoxide = { version = "0.9", default-features = false, features = ["bytes"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
url = "2.5"

